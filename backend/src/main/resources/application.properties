# ===================================================
# StudyApp - Application Configuration
# ===================================================

spring.application.name=studyapp

# ===================================================
# Server
# ===================================================
server.port=8080

# ===================================================
# Database - MySQL
# ===================================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/study_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Keertan@SQL05
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================
# JPA / Hibernate
# ===================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================
# JWT Configuration
# ===================================================
app.jwt.secret=StudyAppSuperSecretKey2026ChangeThisInProductionToALongerRandomString
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ===================================================
# File Upload
# ===================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads

# ===================================================
# AI Provider (configure before using AI features)
# ===================================================
app.ai.provider=openai
app.ai.api-key=your-api-key-here
app.ai.base-url=https://api.openai.com/v1
app.ai.model=gpt-4o
app.ai.timeout-seconds=60
app.ai.max-tokens=4096

# ===================================================
# Mail (configure for password reset emails)
# ===================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=false

# ===================================================
# CORS
# ===================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===================================================
# Swagger / OpenAPI
# ===================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===================================================
# Logging
# ===================================================
logging.level.com.studyapp=DEBUG
logging.level.org.springframework.security=INFO
