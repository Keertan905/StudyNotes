# ===================================================
# StudyApp - Application Configuration
# ===================================================

spring.application.name=studyapp

# ===================================================
# Server
# ===================================================
server.port=8080

# ===================================================
# Database - MySQL (Environment Variable Protected)
# ===================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/study_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Keertan@SQL05}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================
# JPA / Hibernate
# ===================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================
# JWT Configuration (Environment Variable Protected)
# ===================================================
app.jwt.secret=${JWT_SECRET:StudyAppSuperSecretKey2026ChangeThisInProductionToALongerRandomString}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===================================================
# File Upload
# ===================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads

# Optional local overrides for API keys & secrets (git ignored)
spring.config.import=optional:classpath:application-local.properties

# ===================================================
# AI Provider (Groq Cloud - OpenAI Compatible)
# ===================================================
app.ai.provider=groq
app.ai.api-key=${GROQ_API_KEY:your-groq-api-key-here}
app.ai.base-url=https://api.groq.com/openai/v1
app.ai.model=openai/gpt-oss-120b
app.ai.timeout-seconds=60
app.ai.max-tokens=4096

# ===================================================
# YouTube Data API v3 Configuration
# ===================================================
app.youtube.api-key=${YOUTUBE_API_KEY:your-youtube-api-key-here}
app.youtube.max-results=20
app.youtube.timeout-seconds=15

# ===================================================
# Mail (configure for password reset emails)
# ===================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=false

# ===================================================
# CORS
# ===================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===================================================
# Swagger / OpenAPI
# ===================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===================================================
# Sensitive Error Masking & Security
# ===================================================
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ===================================================
# Logging
# ===================================================
logging.level.com.studyapp=INFO
logging.level.org.springframework.security=WARN

